<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AliExpress Fixture Product</title>
    <style>
      body { font-family: Arial, sans-serif; }
      .product { max-width: 900px; margin: 20px auto; }
      .row { display: flex; gap: 20px; }
      .product-price-current { font-size: 24px; font-weight: 700; }
      .slider--slider img { width: 200px; height: 200px; }
    </style>
  </head>
  <body>
    <div class="product">
      <h1 data-pl="product-title">Fixture Tennis Racket Cover</h1>
      <div class="row">
        <div class="slider--slider">
          <img src="https://example.com/image_200x200.jpg" alt="fixture image">
        </div>
        <div class="details">
          <div class="product-price-current">$19.99</div>
          <div data-pl="product-reviewer">
            <strong>4.7</strong>
            <a>132</a>
            <span class="reviewer--sold">1,230 sold</span>
          </div>
          <div class="store-info--desc">
            <strong>98%</strong>
            <strong>50000</strong>
          </div>
        </div>
      </div>
      <ul class="specification--list">
        <li>Material: Nylon</li>
      </ul>
      <div class="description--wrap">
        <div class="description--product-description">
          Durable cover to protect your tennis racket.
        </div>
      </div>
      <div class="pdp-wrap">
        <span class="comet-v2-tag">Sports</span>
      </div>
    </div>
  </body>
  </html>
